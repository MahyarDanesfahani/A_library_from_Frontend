<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ثبت‌نام | گفتگو</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="chat">
    <header>
        <span class="av">🤖</span>
        <div><b>دستیار ثبت‌نام</b><small id="st">آنلاین</small></div>
    </header>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="quick" id="quick"></div>
    <form class="bar" id="f">
        <input id="inp" autocomplete="off" aria-label="پیام شما" disabled placeholder="منتظر پیام دستیار...">
        <button aria-label="ارسال">➤</button>
    </form>
</main>
<script src="script.js"></script>
</body>
</html>
