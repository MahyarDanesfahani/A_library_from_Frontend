<!DOCTYPE html>

    <section class="stage" aria-hidden="true">

                            <div class="main">
                                <div class="kpi"><div class="k"><small>فروش امروز</small><b>۱۸٫۴M</b></div><div class="k"><small>سفارش</small><b>۸۶</b></div></div>

                                <div class="line"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="base"><i></i></div>
            </div>

            <div class="phone">
                <div class="notch"></div>
                <div class="pscr">
                    <div class="ph"><b>🛒 فروشگاه</b></div>
                    <div class="it"><span></span><div><i></i><i></i></div></div>
                    <div class="it"><span></span><div><i></i><i></i></div></div>
                    <div class="it"><span></span><div><i></i><i></i></div></div>
                    <div class="buy">افزودن به سبد</div>
                </div>
            </div>

            <span class="chip c1">⚡ سرعت ۹۸</span>
            <span class="chip c2">📈 رشد فروش +۳۲٪</span>
