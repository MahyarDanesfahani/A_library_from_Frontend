<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>نظرات مشتریان | پشته‌ی کارت</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
    <h1>نظر مشتری‌ها 💜</h1>
    <p class="sub">کارت رو بکش، یا از دکمه‌ها و فلش‌های کیبورد استفاده کن.</p>

    <div class="stack" id="stack" tabindex="0" aria-label="پشته‌ی نظرات؛ با فلش‌های چپ و راست جابجا شو"></div>

    <div class="ctl">
        <button type="button" id="undo" aria-label="کارت قبلی">↶</button>
        <span class="cnt" id="cnt" aria-live="polite"></span>
        <button type="button" id="skip" aria-label="کارت بعدی">➜</button>
    </div>
    <div class="dots" id="dots" aria-hidden="true"></div>
</main>
<script src="script.js"></script>
</body>
</html>
