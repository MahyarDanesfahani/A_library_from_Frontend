<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>نظرات مشتریان | دیوار گفتگو</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
    <section class="intro">
        <h1>مشتری‌ها چی می‌گن؟ 💬</h1>
        <p>نظرها مثل یه گفتگوی واقعی، یکی‌یکی می‌رسن. روی ❤️ بزن تا لایک بشه.</p>
        <button type="button" id="replay" class="replay" hidden>↻ پخش دوباره</button>
    </section>

    <section class="phone" id="phone" aria-label="گفتگوی مشتریان">
        <header><span class="av">⭐</span><div><b>مشتریان ما</b><small id="st">آنلاین</small></div></header>
        <div class="log" id="log" aria-live="polite"></div>
        <div class="fake" aria-hidden="true"><span>پیام بنویس...</span><i>➤</i></div>
    </section>
</main>
<script src="script.js"></script>
</body>
</html>
