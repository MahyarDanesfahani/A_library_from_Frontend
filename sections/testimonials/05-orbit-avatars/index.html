<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>نظرات مشتریان | مدار آواتارها</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
    <h1>مشتری‌ها در مدار ما 🪐</h1>
    <p class="sub">روی یکی از آواتارها بزن تا به بالای مدار بیاد.</p>

    <section class="orbit" id="orbit" aria-label="نظرات مشتریان">
        <div class="ring" aria-hidden="true"></div>
        <div class="avs" id="avs" role="radiogroup" aria-label="انتخاب مشتری"></div>
        <article class="center" id="center" aria-live="polite">
            <div class="stars" id="st"></div>
            <p class="q" id="q"></p>
            <b id="nm"></b><small id="rl"></small>
            <span class="tag" id="tg"></span>
        </article>
    </section>
</main>
<script src="script.js"></script>
</body>
</html>
