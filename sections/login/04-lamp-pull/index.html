<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ورود | چراغ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">

    <!-- سمت چراغ -->
    <section class="lamp-side">
        <div class="lamp-wrap" id="lampWrap">
            <div class="cone" aria-hidden="true"></div>

            <svg id="lampSvg" viewBox="0 0 300 520" role="img" aria-label="چراغ مطالعه">
                <defs>
                    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0" stop-color="#1a1a1d"/>
                        <stop offset=".5" stop-color="#2c2c31"/>
                        <stop offset="1" stop-color="#18181b"/>
                    </linearGradient>
                </defs>

                <!-- نخ (پشت آباژور تا ابتدای آن پنهان بماند) -->
                <g id="cord">
                    <line id="cordLine" x1="185" y1="100" x2="185" y2="190"/>
                    <circle id="bead" cx="185" cy="198" r="8"/>
                    <circle id="hit" cx="185" cy="198" r="26"
                            tabindex="0" role="button" aria-pressed="false"
                            aria-label="نخ چراغ را بکشید یا Enter بزنید"/>
                </g>

                <rect x="147" y="115" width="6" height="365" rx="3" class="pole"/>
                <ellipse cx="150" cy="488" rx="50" ry="10" class="base"/>
                <ellipse id="bulb" cx="150" cy="116" rx="40" ry="8"/>
                <path d="M92 115 C92 70 120 48 150 48 C180 48 208 70 208 115 Z" fill="url(#shade)"/>
            </svg>

            <div id="flies" aria-hidden="true"></div>
        </div>

        <p class="hint" id="hint">نخ چراغ را بکشید پایین</p>
    </section>

    <!-- فرم ورود -->
    <section class="card" id="card" aria-label="فرم ورود">
        <h1>خوش برگشتید</h1>
        <p class="sub">برای ورود به حساب، اطلاعات خود را وارد کنید</p>

        <form id="loginForm" novalidate>
            <label class="field">
                <span>ایمیل</span>
                <input type="email" name="email" placeholder="example@mail.com" autocomplete="email" required>
            </label>

            <label class="field">
                <span>رمز عبور</span>
                <div class="pass">
                    <input type="password" name="password" placeholder="حداقل ۶ کاراکتر" minlength="6" autocomplete="current-password" required>
                    <button type="button" class="eye" aria-label="نمایش رمز">👁</button>
                </div>
            </label>

            <button type="submit" class="submit"><span>ورود</span></button>
            <p class="msg" id="msg" role="alert"></p>
        </form>

        <div class="divider"><span>یا ادامه با</span></div>

        <div class="social">
            <button type="button">Google</button>
            <button type="button">GitHub</button>
        </div>
    </section>

</main>
<script src="script.js"></script>
</body>
</html>
