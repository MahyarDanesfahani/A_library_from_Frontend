<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ورود | صورت فلکی</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<main class="card" id="card">
    <h1>ورود</h1>
    <p class="sub">ستاره‌ها منتظر شما هستند</p>

    <form id="loginForm" novalidate>
        <input type="email" name="email" placeholder="ایمیل" autocomplete="email" aria-label="ایمیل" required>
        <input type="password" name="password" placeholder="رمز عبور" minlength="6" autocomplete="current-password" aria-label="رمز عبور" required>
        <button type="submit"><span>ورود</span></button>
        <p class="msg" id="msg" role="alert"></p>
    </form>

    <a href="#" class="link">حساب ندارید؟ ثبت‌نام</a>
</main>

<script src="script.js"></script>
</body>
</html>
